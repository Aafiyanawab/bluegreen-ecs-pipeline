
services:

  blue:
    image: bluegreen-app:v1
    container_name: blue
    environment:
      - APP_VERSION=v1.0.0
      - APP_COLOR=blue
      - DEPLOY_TIME=2026-08-07T00:00:00Z
    ports:
      - "3001:3000"
    networks:
      - bluegreen-net

  green:
    image: bluegreen-app:v1
    container_name: green
    environment:
      - APP_VERSION=v2.0.0
      - APP_COLOR=green
      - DEPLOY_TIME=2026-08-07T00:00:00Z
    ports:
      - "3002:3000"
    networks:
      - bluegreen-net

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blue
      - green
    networks:
      - bluegreen-net

networks:
  bluegreen-net:
    driver: bridge